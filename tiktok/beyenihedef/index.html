<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
const num=(k,d)=>{const v=parseFloat(Q.get(k));return isFinite(v)&&v>0?v:d};
// Goal settings: studio settings (/api/settings -> widgets.lp) win; URL params are the fallback.
let BASE_GOAL=Math.round(num('goal',10000));
let STEP=Math.round(num('step',BASE_GOAL));
let AUTO=Q.get('autostep')!=='0';
let BASE_LIKES=0, BASE_ROOM=null, RESET_AT=null, roomId=null, rawTotal=null;
const DEMO=Q.get('demo')==='1'||Q.get('demo')==='true';
const REC=Q.get('rec')==='1';
const SC=window.StudioConnect?StudioConnect.resolve():null;
const SERVER=((SC&&SC.http)||(Q.get('host')||Q.get('studio')||Q.get('server')||'').replace(/\/$/,'')||'');
if(Q.get('bg')==='1')document.body.classList.add('preview');

// ---------- layout scale ----------
const fit=document.getElementById('fit');
let stageScale=1;
function layout(){
  const w=innerWidth,h=innerHeight;stageScale=Math.min(w/1280,h/720);
  fit.style.transform=`translate(${(w-1280*stageScale)/2}px,${(h-720*stageScale)/2}px) scale(${stageScale})`;
  setupCanvases();
}
// ---------- state ----------
let goal=BASE_GOAL, target=0, shown=0, level=0, levelV=0;
let celebrating=false, celebratedGoal=-1, started=false;
const curEl=document.getElementById('cur'), goalEl=document.getElementById('goal');
const fillEl=document.getElementById('fill'), heartIcon=document.getElementById('heartIcon'), heartWrap=document.getElementById('heartWrap');
const countEl=document.getElementById('count'), bounceEl=document.getElementById('bounce');
const cntEl=document.getElementById('cnt');let lastW=0;
const fmt=n=>Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
goalEl.textContent=fmt(goal);

function settleGoal(silent){ // step goal past current total without celebration
  if(!AUTO) return;
  let changed=false;
  while(target>=goal){goal+=STEP;changed=true}
  if(changed){goalEl.textContent=fmt(goal);fitCount()}
}
function setTotal(t,opts){
  t=Math.max(0,Math.floor(Number(t)||0));
  opts=opts||{};
  if(!started){ // first value: no animation
    started=true;target=t;
    if(AUTO&&t>=goal) settleGoal(true);
    if(t>=goal) celebratedGoal=goal;
    shown=t;level=Math.min(1,t/goal);render(0);return;
  }
  if(t<target){ // stream reset
    target=t;shown=t;goal=BASE_GOAL;celebratedGoal=-1;settleGoal(true);if(t>=goal)celebratedGoal=goal;goalEl.textContent=fmt(goal);fitCount();return;
  }
  const delta=t-target; if(delta<=0) return;
  target=t;
  onLikes(opts.added||delta);
}
function onLikes(n){
  jellyT=0;
  shocks.push({t:0,life:0.48});
  if(n>=24) shocks.push({t:-0.08,life:0.52});
  const lf=floats[floats.length-1];
  if(lf&&lf.t<0.45){lf.n+=n;lf.txt='+'+fmt(lf.n);lf.t=Math.min(lf.t,0.12);}
  else floats.push({x:380,y:578,t:0,n,txt:'+'+fmt(n)});
  if(floats.length>2) floats.shift();
  splash=Math.min(1.6,splash+0.5+Math.min(1,n/300));
  for(let i=0;i<Math.min(6,2+Math.floor(n/60));i++) spawnBubble(true,false);
}

// ---------- data ----------
function pickTotal(d){
  if(!d||typeof d!=='object') return null;
  const c=[d.totalLikes,d.totalLikeCount,d.total_likes,d.likes_total,d.likeTotal,
    d.state&&d.state.totalLikes, d.data&&d.data.totalLikes, d.data&&d.data.totalLikeCount];
  for(const v of c){const n=Number(v); if(v!=null&&isFinite(n)) return n}
  return null;
}
function adjust(t){ // likes counted since the studio 'Sıfırla' (same live room only)
  if(BASE_LIKES>0 && t>=BASE_LIKES && (BASE_ROOM==null || roomId==null || String(BASE_ROOM)===String(roomId))) return t-BASE_LIKES;
  return t;
}
function handle(d){
  if(!d||typeof d!=='object') return;
  const type=String(d.type||d.event||'').toLowerCase();
  if(d.roomId!=null) roomId=d.roomId;
  if(d.config&&d.config.likeGoalPanda) applyLp(d.config.likeGoalPanda);
  if(type==='settingsupdate'){ loadSettings(); }
  const inner=(d.data&&typeof d.data==='object')?d.data:d;
  let added=null;
  if(type==='likeburst'&&d.lastLikeEvent&&d.lastLikeEvent.added) added=Number(d.lastLikeEvent.added);
  else if(type==='like') added=Number(inner.likeCount||inner.count||inner.likes||1);
  const total=pickTotal(d);
  if(total!=null){ rawTotal=total; setTotal(adjust(total),{added:added&&added>0?added:null}); }
  else if(added&&type==='like'){ rawTotal=(rawTotal||0)+added; setTotal(adjust(rawTotal),{added}); }
}
function applyGoalConfig(){ // recompute goal silently from the start goal
  goal=BASE_GOAL; celebrating=false; celebratedGoal=-1;
  if(started){ if(AUTO) while(target>=goal) goal+=STEP; if(target>=goal) celebratedGoal=goal; }
  goalEl.textContent=fmt(goal); fitCount();
}
let lastLpKey=null;
function applyLp(lp){ // lp = {goal, step, auto, base, baseRoom, resetAt}
  if(!lp||typeof lp!=='object') return;
  const key=JSON.stringify([lp.goal,lp.step,lp.auto,lp.base,lp.baseRoom,lp.resetAt]);
  if(key===lastLpKey) return; lastLpKey=key;
  const g=Math.round(Number(lp.goal)), st=Math.round(Number(lp.step));
  const nb=isFinite(g)&&g>0?g:BASE_GOAL, ns=isFinite(st)&&st>0?st:nb, na=!(lp.auto===0||lp.auto===false||lp.auto==='0');
  const resetChanged=RESET_AT!==null && Number(lp.resetAt||0)!==RESET_AT;
  const cfgChanged=nb!==BASE_GOAL||ns!==STEP||na!==AUTO;
  BASE_GOAL=nb;STEP=ns;AUTO=na;
  BASE_LIKES=Math.max(0,Number(lp.base)||0); BASE_ROOM=lp.baseRoom!=null?lp.baseRoom:null;
  const firstLoad=RESET_AT===null; RESET_AT=Number(lp.resetAt||0);
  if(resetChanged && rawTotal!=null){ const c=adjust(rawTotal); target=c; shown=c; level=Math.min(1,c/BASE_GOAL); }
  if(firstLoad||cfgChanged||resetChanged) applyGoalConfig();
}
// Sources: /api/settings -> widgets.lp (settings API) or state.config.likeGoalPanda (/api/state, /events).
function loadSettings(){
  const a=fetch(SERVER+'/api/settings',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    const lp=j&&j.settings&&j.settings.widgets&&j.settings.widgets.lp; if(lp) applyLp(lp);
  }).catch(()=>{});
  const b=fetch(SERVER+'/api/state',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(j&&j.config&&j.config.likeGoalPanda) applyLp(j.config.likeGoalPanda);
  }).catch(()=>{});
  return Promise.all([a,b]);
}
function connect(){
  fetch(SERVER+'/api/state',{cache:'no-store'}).then(r=>r.json()).then(handle).catch(()=>{});
  if(window.StudioConnect){
    StudioConnect.connect(handle);
    return;
  }
  let es;
  const open=()=>{
    try{es=new EventSource(SERVER+'/events')}catch(e){setTimeout(open,3000);return}
    es.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}};
    es.onerror=()=>{ if(es.readyState===2){setTimeout(open,3000)} };
  };
  open();
}
function demo(){
  setTotal(Math.round(goal*0.70));
  let i=0;
  const tick=()=>{
    i++;
    const remaining=goal-target;
    let n;
    if(!celebrating&&remaining>0&&remaining<=goal*0.32) n=Math.max(20,Math.round(goal*0.3/15*(0.6+Math.random()*0.8)));
    else n=Math.max(1,Math.round([10,15,25,40,60,90][Math.floor(Math.random()*6)]*goal/10000));
    setTotal(target+n,{added:n});
    setTimeout(tick,celebrating?700:280+Math.random()*260);
  };
  setTimeout(tick,700);
}

// ---------- canvases ----------
const lc=document.getElementById('liquid'), ec=document.getElementById('eyes'), fc=document.getElementById('fx'), fbc=document.getElementById('fxb');
const lx=lc.getContext('2d'), ex=ec.getContext('2d'), fx=fc.getContext('2d'), fxb=fbc.getContext('2d');
let R=1;
function setupCanvases(){
  R=Math.max(1,Math.min(2.5,(window.devicePixelRatio||1)*stageScale));
  for(const [c,w,h] of [[lc,439,442],[ec,439,442],[fc,1280,720],[fbc,1280,720]]){c.width=Math.round(w*R);c.height=Math.round(h*R)}
}
const load=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
let maskImg,edgeImg,hlImg,texImg;const bubImgs=[];
// panda-local geometry (stage coords minus 421,117)
const OX=421,OY=117;
const CAV={x0:489-OX,x1:790-OX,top:308-OY,bottom:537-OY};
const LEVEL_BOTTOM=532-OY, LEVEL_TOP=309-OY; // y for 0% / 100%
const bubbles=[];let splash=0;
function spawnBubble(fromBottom,big){
  if(big==null) big=Math.random()<0.22;
  const sc=big?0.75+Math.random()*0.45:1;
  bubbles.push({x:CAV.x0+40+Math.random()*(CAV.x1-CAV.x0-80),
    y:fromBottom?LEVEL_BOTTOM-8-Math.random()*30:LEVEL_TOP+30+Math.random()*(LEVEL_BOTTOM-LEVEL_TOP-30),
    r:big?18*sc:0.7+Math.random()*1.9, spr:big?Math.floor(Math.random()*6):null, sc,
    v:big?3+Math.random()*5:7+Math.random()*14,ph:Math.random()*6.28,a:0});
}
for(let i=0;i<22;i++) spawnBubble(false,false);for(let i=0;i<9;i++) spawnBubble(false,true);
const sparks=[];for(let i=0;i<70;i++) sparks.push({x:CAV.x0+20+Math.random()*(CAV.x1-CAV.x0-40),y:LEVEL_TOP+Math.random()*(LEVEL_BOTTOM-LEVEL_TOP),r:.4+Math.random()*.9,ph:Math.random()*6.28,s:.4+Math.random()});

function surfaceY(x,t,ly,amp){ // back edge of the liquid top face
  return ly+Math.sin(x*0.045+t*2.1)*0.9*amp+Math.sin(x*0.083-t*2.9)*0.6*amp+Math.sin(x*0.021+t*1.3)*0.7*amp;
}
function frontY(x,t,ly,amp){ // front edge (sags toward the viewer, like the approved art)
  const cx=(CAV.x0+CAV.x1)/2, hw=(CAV.x1-CAV.x0)/2, u=Math.max(-1,Math.min(1,(x-cx)/hw));
  const sag=11*(1-u*u)*Math.min(1,(ly-LEVEL_TOP+8)/40);
  return ly+sag+Math.sin(x*0.05-t*2.4)*0.8*amp+Math.sin(x*0.09+t*1.9)*0.5*amp;
}
function drawLiquid(t){
  const c=lx;c.setTransform(R,0,0,R,0,0);c.clearRect(0,0,439,442);
  if(!maskImg||level<=0.001) return;
  const ly=LEVEL_BOTTOM-(LEVEL_BOTTOM-LEVEL_TOP)*Math.min(1.02,level);
  const amp=1+splash*1.3;
  const x0=CAV.x0-6,x1=CAV.x1+6;
  // body
  c.save();
  c.beginPath();c.moveTo(x0,442);
  for(let x=x0;x<=x1;x+=4)c.lineTo(x,surfaceY(x,t,ly,amp));
  c.lineTo(x1,442);c.closePath();
  c.fillStyle='#c4102a';c.fill();
  c.clip();
  if(texImg) c.drawImage(texImg,0,0,439,442);
  // gentle depth: slightly deeper toward the surface edges, lighter core near bottom
  const cx=(CAV.x0+CAV.x1)/2, cy=CAV.bottom-60;
  const rg=c.createRadialGradient(cx,cy,4,cx,cy,120);
  rg.addColorStop(0,'rgba(255,90,104,.28)');rg.addColorStop(1,'rgba(255,60,80,0)');
  c.fillStyle=rg;c.fillRect(0,0,439,442);
  // sparkles
  for(const s of sparks){ if(s.y<ly+4) continue; const a=.25+.35*Math.max(0,Math.sin(t*s.s*2+s.ph));
    c.fillStyle=`rgba(255,200,205,${a})`;c.beginPath();c.arc(s.x,s.y,s.r,0,6.283);c.fill();}
  // bubbles
  for(const b of bubbles){
    if(b.y<ly+b.r+1) continue;
    const bx=b.x+Math.sin(t*1.7+b.ph)*1.5;
    c.globalAlpha=Math.min(1,b.a)*Math.max(0,Math.min(1,(b.y-ly-b.r)/10));
    if(b.spr!=null&&bubImgs[b.spr]){
      const im=bubImgs[b.spr], w=im.width*b.sc, h=im.height*b.sc;
      c.drawImage(im,bx-w/2,b.y-h/2,w,h);
    }else{
      c.fillStyle='rgba(255,175,182,.5)';c.beginPath();c.arc(bx,b.y,b.r,0,6.283);c.fill();
      c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(bx-b.r*.3,b.y-b.r*.3,b.r*.38,0,6.283);c.fill();
    }
  }
  c.globalAlpha=1;
  // top face of liquid (between back edge and sagging front edge)
  c.beginPath();
  for(let x=x0;x<=x1;x+=3)c.lineTo(x,surfaceY(x,t,ly,amp));
  for(let x=x1;x>=x0;x-=3)c.lineTo(x,frontY(x,t,ly,amp));
  c.closePath();
  const sg=c.createLinearGradient(0,ly-2,0,ly+12);
  sg.addColorStop(0,'rgba(255,110,124,.55)');sg.addColorStop(1,'rgba(255,72,92,.38)');
  c.fillStyle=sg;c.fill();
  // just under the front edge: soft lighter lip
  c.beginPath();
  for(let x=x0;x<=x1;x+=3)c.lineTo(x,frontY(x,t,ly,amp));
  for(let x=x1;x>=x0;x-=3)c.lineTo(x,frontY(x,t,ly,amp)+9);
  c.closePath();
  const lg=c.createLinearGradient(0,ly,0,ly+20);
  lg.addColorStop(0,'rgba(255,80,98,.35)');lg.addColorStop(1,'rgba(255,80,98,0)');
  c.fillStyle=lg;c.fill();
  c.restore();
  // edge lines
  c.lineJoin='round';
  c.beginPath();for(let x=x0;x<=x1;x+=3)c.lineTo(x,surfaceY(x,t,ly,amp)+.5);
  c.strokeStyle='rgba(255,190,198,.75)';c.lineWidth=1.3;c.stroke();
  c.beginPath();for(let x=x0;x<=x1;x+=3)c.lineTo(x,frontY(x,t,ly,amp));
  c.strokeStyle='rgba(255,160,172,.6)';c.lineWidth=1.6;c.stroke();
  // edge shading + glass highlight, only where liquid already is
  c.globalCompositeOperation='source-atop';
  if(edgeImg) c.drawImage(edgeImg,0,0,439,442);
  if(hlImg){c.globalAlpha=.9;c.drawImage(hlImg,0,0,439,442);c.globalAlpha=1}
  // clip to heart cavity minus paws
  c.globalCompositeOperation='destination-in';
  c.drawImage(maskImg,0,0,439,442);
  c.globalCompositeOperation='source-over';
}
// eyes / blink
const EYES=[{x:583-OX,y:250-OY,rx:23,ry:20,ix:554-OX,iy:224-OY},{x:684-OX,y:246-OY,rx:22,ry:20,ix:656-OX,iy:220-OY}];const lidImgs=[];
let nextBlink=1.5+Math.random()*2, blinkT=-1, dbl=false;
function drawEyes(t,dt){
  const c=ex;c.setTransform(R,0,0,R,0,0);c.clearRect(0,0,439,442);
  if(blinkT<0&&t>nextBlink){blinkT=0}
  if(window.__eyeHold!=null){blinkT=0.16*0.45*window.__eyeHold;dt=0}
  if(blinkT<0) return;
  blinkT+=dt;const D=0.16;let k=blinkT/D;
  if(k>=1){blinkT=-1;if(!dbl&&Math.random()<0.25){dbl=true;nextBlink=t+0.12}else{dbl=false;nextBlink=t+2.6+Math.random()*3.5}return}
  const close=k<0.45?k/0.45:Math.max(0,1-(k-0.45)/0.55);
  const e=close*close*(3-2*close);
  EYES.forEach((E,i)=>{
    const im=lidImgs[i]; if(!im) return;
    const top=E.y-E.ry-4, lidY=top+(E.ry*2+8)*e;
    c.save();c.beginPath();
    c.moveTo(E.x-E.rx-6,top-4);c.lineTo(E.x+E.rx+6,top-4);
    c.lineTo(E.x+E.rx+6,lidY-5);c.quadraticCurveTo(E.x,lidY+6,E.x-E.rx-6,lidY-5);c.closePath();c.clip();
    c.drawImage(im,E.ix,E.iy);
    c.restore();
    if(e<0.97){ // lid edge while moving
      c.save();c.beginPath();c.ellipse(E.x,E.y,E.rx+1,E.ry+1,0,0,6.283);c.clip();
      c.strokeStyle='rgba(8,6,7,.85)';c.lineWidth=2;c.beginPath();
      c.moveTo(E.x-E.rx-6,lidY-5);c.quadraticCurveTo(E.x,lidY+6,E.x+E.rx+6,lidY-5);c.stroke();c.restore();
    }
  });
}
// fx: floats + heart burst
const floats=[], parts=[];
function heartPath(c,x,y,s){
  c.beginPath();c.moveTo(x,y+s*.35);
  c.bezierCurveTo(x,y,x-s*.5,y-s*.05,x-s*.5,y+s*.3);
  c.bezierCurveTo(x-s*.5,y+s*.6,x-s*.1,y+s*.8,x,y+s);
  c.bezierCurveTo(x+s*.1,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);
  c.bezierCurveTo(x+s*.5,y-s*.05,x,y,x,y+s*.35);c.closePath();
}
function burst(){
  const cols=['#ff2e43','#e0142c','#ff5a6b','#c40c22','#ff7584'];
  for(let i=0;i<20;i++){
    const a=-Math.PI/2+(i/19-.5)*Math.PI*1.45+(Math.random()-.5)*.2, sp=420+Math.random()*260;
    const r0=110+Math.random()*30;
    parts.push({x:640+Math.cos(a)*r0*1.2,y:400+Math.sin(a)*r0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:16+Math.random()*16,
      rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*1.6,t:0,life:1.6+Math.random()*.6,col:cols[i%cols.length],front:i%4===0});
  }
}
function drawFx(dt){
  fxb.setTransform(R,0,0,R,0,0);fxb.clearRect(0,0,1280,720);
  fx.setTransform(R,0,0,R,0,0);fx.clearRect(0,0,1280,720);
  let c;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}
    p.vx*=Math.pow(.06,dt);p.vy*=Math.pow(.06,dt);p.vy+=120*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const a=Math.min(1,(p.life-p.t)/.5)*Math.min(1,p.t/.08);
    c=p.front?fx:fxb;
    c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);
    const g=c.createLinearGradient(0,-p.s*.5,0,p.s*.5);g.addColorStop(0,'#ff7a88');g.addColorStop(.4,p.col);g.addColorStop(1,'#8e0016');
    c.fillStyle=g;heartPath(c,0,-p.s*.5,p.s);c.fill();
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-p.s*.22,-p.s*.25,p.s*.1,p.s*.06,-.6,0,6.283);c.fill();
    c.restore();}
  c=fx;
  c.font='900 30px LGNunito, sans-serif';c.textAlign='center';c.textBaseline='middle';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>1.1){floats.splice(i,1);continue}
    const k=f.t/1.1, y=f.y-70*(1-Math.pow(1-k,2)), a=k<.15?k/.15:Math.max(0,1-(k-.55)/.45);
    c.globalAlpha=a;c.lineWidth=5;c.strokeStyle='rgba(30,6,10,.85)';c.strokeText(f.txt,f.x,y);
    c.fillStyle='#ff3c50';c.fillText(f.txt,f.x,y);c.globalAlpha=1;}
}

// ---------- heart C: idle sway + jelly bounce + shockwave rings ----------
let jellyT=99;
const shocks=[];
function jelly(t){
  const keys=[[0,1,1],[0.055,1.30,0.74],[0.15,0.82,1.24],[0.26,1.15,0.88],[0.38,0.91,1.10],[0.50,1.06,0.96],[0.62,0.98,1.03],[0.74,1,1]];
  if(t>=0.74) return {sx:1,sy:1};
  for(let i=1;i<keys.length;i++){
    if(t<=keys[i][0]){
      const a=keys[i-1], b=keys[i], u=(t-a[0])/(b[0]-a[0]), e=u*u*(3-2*u);
      return {sx:a[1]+(b[1]-a[1])*e, sy:a[2]+(b[2]-a[2])*e};
    }
  }
  return {sx:1,sy:1};
}
function tickHeart(dt){
  jellyT+=dt;
  const sway=Math.sin(T*2.05)*2.8+Math.sin(T*3.1)*0.9;
  const sq=Math.sin(T*2.05);
  const j=jelly(jellyT);
  heartWrap.style.transform='rotate('+sway+'deg) scale('+(1+sq*0.03)*j.sx+','+(1-sq*0.03)*j.sy+')';
  const c=fx, cx=375, cy=605;
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i]; s.t+=dt; if(s.t<0) continue;
    if(s.t>s.life){shocks.splice(i,1);continue;}
    const k=s.t/s.life, rad=14+k*58, a=Math.pow(1-k,1.35)*0.9;
    c.save();
    c.globalAlpha=a*0.35; c.strokeStyle='#ff6a7c'; c.lineWidth=7*(1-k*0.5);
    c.beginPath();c.arc(cx,cy,rad,0,6.283);c.stroke();
    c.globalAlpha=a*0.85; c.strokeStyle='#ffd0d6'; c.lineWidth=2.2*(1-k*0.4);
    c.beginPath();c.arc(cx,cy,rad,0,6.283);c.stroke();
    c.restore();
  }
}
// ---------- main loop ----------
let last=performance.now(), T=0, breathT=0;
const pandaWrap=document.getElementById('pandaWrap');
function fitCount(){const w=cntEl.offsetWidth; if(w===lastW) return; lastW=w; cntEl.style.transform=w>420?`scale(${420/w})`:'';}
function celebrate(){
  celebrating=true;
  bounceEl.classList.remove('hop');void bounceEl.offsetWidth;bounceEl.classList.add('hop');
  countEl.classList.remove('flash');void countEl.offsetWidth;countEl.classList.add('flash');
  burst();
  splash=1.6;
  setTimeout(()=>{
    if(AUTO){ while(target>=goal) goal+=STEP; goalEl.textContent=fmt(goal);fitCount();
      goalEl.classList.remove('goalFlip');void goalEl.offsetWidth;goalEl.classList.add('goalFlip'); }
    celebrating=false;
  },2000);
}
function render(dt){
  // count-up
  const diff=target-shown;
  if(Math.abs(diff)<1) shown=target; else shown+=diff*Math.min(1,dt*5)+Math.sign(diff)*Math.min(Math.abs(diff),dt*20);
  let disp=shown;
  if(!celebrating && target>=goal && celebratedGoal!==goal){ disp=Math.min(shown,goal); if(shown>=goal-0.5){ shown=Math.max(shown,goal); celebratedGoal=goal; celebrate(); } }
  const txt=fmt(disp); if(curEl.textContent!==txt){curEl.textContent=txt;fitCount();}
  const frac=(celebrating||celebratedGoal===goal&&shown>=goal)?1:Math.min(1,shown/goal);
  // liquid spring
  const k=10,d=6.5; levelV+=((frac-level)*k-levelV*d)*dt; level+=levelV*dt;
  if(dt===0) level=frac;
  fillEl.style.width=(Math.max(0,Math.min(1,level))*584)+'px';
}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  splash=Math.max(0,splash-dt*1.4);
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.v*dt*(1+splash*.6);b.a=Math.min(1,b.a+dt*2);
    const ly=LEVEL_BOTTOM-(LEVEL_BOTTOM-LEVEL_TOP)*level;
    if(b.y<ly+b.r+2){bubbles.splice(i,1);}}
  let nb=0;for(const b of bubbles) if(b.spr!=null) nb++;
  while(nb<9){spawnBubble(true,true);nb++}
  while(bubbles.length<31) spawnBubble(true,false);
  for(const s of sparks){s.y-=dt*3*s.s;if(s.y<LEVEL_TOP)s.y=LEVEL_BOTTOM;}
  render(dt);
  // breathing
  const br=Math.sin(T*2*Math.PI/3.8);
  pandaWrap.style.transform=`scale(${1+br*0.0035},${1+br*0.0075})`;
  drawLiquid(T);drawEyes(T,dt);drawFx(dt);tickHeart(dt);
  requestAnimationFrame(loop);
}
addEventListener('resize',layout);
Promise.all([load('assets/liquid_mask.png'),load('assets/liquid_edge.png'),load('assets/glass_hl.png'),load('assets/liquid_tex.png'),Promise.all([0,1,2,3,4,5].map(i=>load('assets/bubble'+i+'.png'))),Promise.all([0,1].map(i=>load('assets/eyelid'+i+'.png'))),document.fonts?document.fonts.load('900 60px LGNunito'):0])
.then(([m,e,h,tx,bb,ll])=>{ll.forEach((l,i)=>lidImgs[i]=l);maskImg=m;edgeImg=e;hlImg=h;texImg=tx;bb.forEach((b,i)=>bubImgs[i]=b);layout();
  const go=()=>{ if(REC) return; if(DEMO) demo(); else connect(); };
  loadSettings().then(go,go);
  last=performance.now();requestAnimationFrame(loop);
  window.__ready=true;});
window.__likegoal={setTotal,handle,get state(){return{goal,target,shown,level}}};
})();
