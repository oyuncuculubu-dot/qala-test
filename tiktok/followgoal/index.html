<!doctype html>
<html lang="az"><head><meta charset="utf-8">
<title>GameCamp – Takipçi Hədəfi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GameCamp Studio: Takipçi Hədəfi (şüşə boru). Browser Source 260×664 (100%).
     Query: ?goal=100&step=100&autostep=0&scale=1&host=127.0.0.1:4000&port=4000&demo=1 -->
<style>
@font-face{font-family:'GCB';font-weight:600;src:url(ASSET/fonts/Barlow-SemiBold.woff2) format('woff2')}
@font-face{font-family:'GCB';font-weight:700;src:url(ASSET/fonts/Barlow-Bold.woff2) format('woff2')}
@font-face{font-family:'GCB';font-weight:800;src:url(ASSET/fonts/Barlow-ExtraBold.woff2) format('woff2')}
@font-face{font-family:'GCB';font-weight:900;src:url(ASSET/fonts/Barlow-Black.woff2) format('woff2')}
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:260px;height:664px;transform-origin:0 0;font-family:'GCB','Barlow',sans-serif;color:#fff}
#stage canvas{position:absolute;left:0;top:0;width:260px;height:664px;pointer-events:none}
#cv{z-index:1}#fx{z-index:5}
#tx{position:absolute;left:0;top:0;width:260px;height:664px;z-index:2;pointer-events:none}
#pct{position:absolute;left:0;width:260px;text-align:center;font:900 20px 'GCB';letter-spacing:.01em;text-shadow:0 2px 6px rgba(0,25,30,.75),0 0 2px rgba(0,25,30,.8);opacity:.96}
#pct small{font-size:12px;margin-left:1px}
#num{position:absolute;left:0;width:260px;text-align:center;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
#cur{font:900 46px 'GCB';letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.42),0 0 20px rgba(80,255,200,.38);display:inline-block;transform-origin:50% 70%}
#gl{font:800 17px 'GCB';color:#9ec3c4;margin-left:6px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#lab{position:absolute;left:0;width:260px;text-align:center;font:800 11.5px 'GCB';letter-spacing:.24em;color:#6ff0c8;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#lab i{display:inline-block;width:6px;height:6px;transform:rotate(45deg);background:#ffd36b;margin:0 7px 1px;box-shadow:0 0 8px #ffd36b}
#fol{position:absolute;left:0;width:260px;height:28px;display:flex;justify-content:center;align-items:center;opacity:0;transform-origin:50% 50%}
#fol .avs{display:flex}
#fol .avs span{width:26px;height:26px;border-radius:50%;margin-left:-8px;border:2px solid #0b1418;box-shadow:0 0 0 1.5px #3fd9b0,0 2px 5px rgba(0,0,0,.55);background:#16363a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:800 12px 'GCB';color:#bff;overflow:hidden}
#fol .avs span:first-child{margin-left:0}
#fol .nm{margin-left:9px;font:800 14px 'GCB';color:#f2fbf8;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.75)}
#fol .nm b{color:#6ff0c8;margin-right:3px}
#pi{position:absolute;z-index:3;pointer-events:none;width:190px;height:190px;transform-origin:50% 84%;filter:drop-shadow(0 7px 6px rgba(0,0,0,.5))}
.dbg{position:fixed;right:6px;bottom:6px;font:600 11px monospace;color:#fff;background:#0009;padding:3px 6px;border-radius:4px;display:none;z-index:99}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="tx"><div id="pct"></div><div id="num"><span id="cur">0</span><span id="gl">/ 100</span></div><div id="lab">TAKİPÇİ<i></i>HƏDƏFİ</div><div id="fol"><div class="avs" id="avs"></div><div class="nm" id="nm"></div></div></div>
  <img id="pi" alt="">
  <canvas id="fx"></canvas>
</div>
<div class="dbg" id="dbg"></div>
<script>
(function(){
'use strict';
/* ---------- config ---------- */
var qs=new URLSearchParams(location.search);
var BASE_GOAL=Math.max(1,parseInt(qs.get('goal'),10)||100);
var STEP=Math.max(1,parseInt(qs.get('step'),10)||BASE_GOAL);
var AUTO=qs.get('autostep')!=='0';
var SCALE=Math.min(2.5,Math.max(.3,parseFloat(qs.get('scale'))||1));
var POSX=parseFloat(qs.get('x'))||0, POSY=parseFloat(qs.get('y'))||0;
var MANUAL=qs.get('manual')==='1', DEMO=qs.get('demo')==='1';
var remote=location.protocol==='file:'||/\.github\.io$/i.test(location.hostname)||qs.has('studio')||qs.has('host')||qs.has('server');
var API=remote?((qs.get('host')||qs.get('studio')||qs.get('server')||(/\.github\.io$/i.test(location.hostname)&&!qs.has('port')?'https://widget.gamecamplive.com':'http://127.0.0.1:'+(qs.get('port')||'4000'))).replace(/^(?!https?:\/\/|wss?:\/\/)/,'http://').replace(/\/+$/,'')).replace(/^wss:/,'https:').replace(/^ws:/,'http:'):'';
var AB=(function(){var p=location.pathname.replace(/\/index\.html$/i,'').replace(/\/?$/,'/');return p+'assets'})();
document.querySelectorAll('style').forEach(function(s){s.textContent=s.textContent.split('ASSET/').join(AB+'/')});
var $=function(id){return document.getElementById(id)};
var stage=$('stage');
stage.style.transform='translate('+POSX+'px,'+POSY+'px) scale('+SCALE+')';

/* ---------- helpers ---------- */
var cl=function(x,a,b){a=a==null?0:a;b=b==null?1:b;return Math.max(a,Math.min(b,x))};
var eo=function(x){return 1-Math.pow(1-x,3)}, eio=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
var fmtn=function(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
var rnd=(function(){var s=7;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}})();

/* ---------- geometry: art px -> stage css px ---------- */
var S=.42, OX=20, OY=40, CX_ART=431.5, TOP_ART=118;
var TX=OX+110, TY=OY+112;                       // tube axis x, art y=118 -> css y
var X=function(x){return TX+(x-CX_ART)*S}, Y=function(y){return TY+(y-TOP_ART)*S};
var IN_L=X(299), IN_R=X(564), IN_T=Y(128), IN_B=Y(884), R_IN=(IN_R-IN_L)/2;
var LV_B=Y(878), LV_T=Y(150);                   // 0% / 100% surface y
var ART={glass:{x:270,y:100,w:330,h:812},base:{x:228,y:842,w:407,h:191},liquid:{x:302,y:110,w:260,h:795}};
var IM={};['glass:art/glass.png','base:art/base.png','liquid:art/liquid.jpg'].forEach(function(s){var p=s.split(':'),i=new Image();i.decoding='async';i.src=AB+'/'+p[1];IM[p[0]]=i});

/* ---------- canvases ---------- */
var cv=$('cv'),fx=$('fx'),ctx=cv.getContext('2d'),fxc=fx.getContext('2d'),W=260,H=664;
var RATIO=Math.min(3,Math.max(1.5,SCALE*(window.devicePixelRatio||1)));
[cv,fx].forEach(function(c){c.width=Math.round(W*RATIO);c.height=Math.round(H*RATIO)});
function capsule(c,x0,y0,x1,y1){var r=(x1-x0)/2;c.beginPath();c.moveTo(x0,y0+r);c.arc(x0+r,y0+r,r,Math.PI,0);c.lineTo(x1,y1-r);c.arc(x0+r,y1-r,r,0,Math.PI);c.closePath()}

/* ---------- text layout (css px inside stage) ---------- */
var BASE_BOT=Y(1033);
$('pct').style.top=Math.round(Y(520))+'px';
$('num').style.top=Math.round(BASE_BOT+8)+'px';
$('lab').style.top=Math.round(BASE_BOT+60)+'px';
$('fol').style.top=Math.round(BASE_BOT+82)+'px';
var PI=$('pi');PI.style.left=(TX-95)+'px';PI.style.top=(OY-30)+'px';

/* ---------- panda frames ---------- */
var IDLE=[],CEL=[],HAPPY=AB+'/panda/happy.webp';
for(var i=0;i<50;i++)IDLE.push(AB+'/panda/i'+('0'+i).slice(-2)+'.webp');
for(i=0;i<40;i++)CEL.push(AB+'/panda/c'+('0'+i).slice(-2)+'.webp');
var preload=IDLE.concat(CEL,[HAPPY]).map(function(u){var im=new Image();im.decoding='async';im.src=u;return im});
window.__fgReady=function(){return Promise.all(preload.concat([IM.glass,IM.base,IM.liquid]).map(function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve()})).then(function(){return document.fonts?document.fonts.ready:0})};

/* ---------- state ---------- */
var goal=BASE_GOAL, target=0, shown=0, level=0, lvVel=0, seeded=false;
var celebratedGoal=-1, goalRun=-1;         // goalRun >=0: seconds into goal celebration
var folRun=-1, folPow=0;                    // follow celebration clock / strength
var slosh=0, sloshPh=0, flash=0, T=0;
var names=[], tickN=0;
var parts=[], bubbles=[], pops=[], rings=[];
var banner=0;
var avCache={};

function avUrl(u){if(!u)return '';u=String(u);var m=/\/assets\/avatars\/(avatar\d+\.jpg)/.exec(u);if(m)return AB+'/av/'+m[1];return u}
function clean(n){return String(n||'Yeni takipçi').replace(/^@+/,'').trim().slice(0,22)||'Yeni takipçi'}
function ini(n){return (String(n).replace(/[^\p{L}\p{N}]/gu,'')[0]||'+').toUpperCase()}
function pushFollower(name,av){name=clean(name);names.unshift({n:name,a:avUrl(av)});if(names.length>3)names.length=3;paintFol()}
function paintFol(){
  var h='';names.slice().reverse().forEach(function(o){h+='<span style="'+(o.a?'background-image:url(&quot;'+String(o.a).replace(/["<>]/g,'')+'&quot;)':'')+'">'+(o.a?'':ini(o.n))+'</span>'});
  $('avs').innerHTML=h;var l=names[0];$('nm').innerHTML=l?'<b>+</b>'+l.n.replace(/[<>&]/g,''):'';
}
function fitGoalText(){$('gl').textContent='/ '+fmtn(goal)}

/* ---------- goal logic (auto-increase like Bəyəni Hədəfi) ---------- */
function settleGoal(){if(!AUTO)return;var ch=false;while(target>=goal){goal+=STEP;ch=true}if(ch)fitGoalText()}
function setCount(n,silent){
  n=Math.max(0,Math.round(n));
  if(!seeded){seeded=true;target=n;shown=n;goal=BASE_GOAL;celebratedGoal=-1;settleGoal();if(target>=goal)celebratedGoal=goal;level=cl(target/goal);fitGoalText();return}
  if(n<target){ // reset (new session) -> silent
    target=n;shown=n;goal=BASE_GOAL;celebratedGoal=-1;goalRun=-1;settleGoal();if(target>=goal)celebratedGoal=goal;fitGoalText();return}
  var d=n-target;target=n;
  if(d>0&&!silent)onFollow(d);
}
function onFollow(d){
  folRun=0;folPow=Math.min(1,.45+d*.2);slosh=Math.min(1.8,slosh+.9+.25*Math.min(d,5));flash=Math.min(1,flash+.8);
  burstBubbles(10+Math.min(d,6)*4);
  for(var k=0;k<Math.min(30,12+d*3);k++){var side=rnd()<.5?-1:1,cx=TX+side*(34+rnd()*14),cy=Y(300+rnd()*140);var a=-Math.PI/2+side*(.25+rnd()*.9),sp=70+rnd()*160;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp*.7,vy:Math.sin(a)*sp,g:210,life:1.3+rnd()*.7,t:0,k:rnd()<.45?'h':(rnd()<.5?'s':'c'),c:['#6ff0c8','#ffd36b','#ffffff','#ff7aa8'][Math.floor(rnd()*4)],sz:4+rnd()*4.5,rot:rnd()*6})}
  pops.push({t:0,txt:'+'+d,x:TX+70,y:Y(330),dur:1.5});
  folShow=0;
}
var folShow=-1;
function maybeGoal(){
  if(goalRun<0&&target>=goal&&celebratedGoal!==goal&&shown>=goal-.5){
    celebratedGoal=goal;goalRun=0;banner=0;flash=1;
    for(var k=0;k<90;k++){var a=-Math.PI/2+(rnd()-.5)*3.0,sp=120+rnd()*330;parts.push({x:TX+(rnd()-.5)*60,y:Y(190),vx:Math.cos(a)*sp*.75,vy:Math.sin(a)*sp,g:260,life:2+rnd()*1.3,t:0,k:['h','s','c','c'][Math.floor(rnd()*4)],c:['#6ff0c8','#ffd36b','#ffffff','#ff7aa8','#8fb8ff'][Math.floor(rnd()*5)],sz:3+rnd()*5,rot:rnd()*6})}
    burstBubbles(40);rings.push({t:0,x:TX,y:Y(480),big:1});
  }
}
function burstBubbles(n){var w=IN_R-IN_L;for(var k=0;k<n;k++)bubbles.push({x:IN_L+10+rnd()*(w-20),y:IN_B-6-rnd()*20,r:1.6+rnd()*3.4,v:30+rnd()*55,ph:rnd()*6.28,wob:.8+rnd()*1.2,life:0,boost:1})}

/* ---------- drawing ---------- */
function mapImg(c,im,g){c.drawImage(im,X(g.x),Y(g.y),g.w*S,g.h*S)}
function surfY(x,t,f){ // wave: gentle idle + slosh impulse
  var a1=.9+slosh*3.2, a2=.45+slosh*1.8, k=(x-IN_L)/(IN_R-IN_L)*Math.PI*2;
  return f+Math.sin(k*1.0+t*1.5+sloshPh)*a1*.6+Math.sin(k*2.3-t*2.1)*a2*.5+Math.sin(k*.5+t*.8)*.7*a1*.4;
}
function render(){
  var c=ctx;c.setTransform(RATIO,0,0,RATIO,0,0);c.clearRect(0,0,W,H);c.imageSmoothingQuality='high';
  // base (steel disc) with soft shadow
  c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=14;c.shadowOffsetY=6;mapImg(c,IM.base,ART.base);c.restore();
  // interior tint for contrast on bright scenes
  c.save();capsule(c,IN_L,IN_T,IN_R,IN_B);c.clip();c.fillStyle='rgba(3,14,18,.46)';c.fillRect(IN_L,IN_T,IN_R-IN_L,IN_B-IN_T);
  // liquid
  var sy=LV_B-(LV_B-LV_T)*cl(level,0,1.0);
  if(level>.003){
    c.save();c.beginPath();var x0=IN_L-2,x1=IN_R+2,st=3;c.moveTo(x0,IN_B+4);c.lineTo(x0,surfY(x0,T,sy));
    for(var x=x0;x<=x1;x+=st)c.lineTo(x,surfY(x,T,sy));c.lineTo(x1,IN_B+4);c.closePath();c.clip();
    var lg=ART.liquid;c.drawImage(IM.liquid,X(lg.x)-.5,Y(lg.y)-.5+Math.sin(T*.35)*1.2,lg.w*S+1,lg.h*S+1);
    // depth + light overlays
    var g1=c.createLinearGradient(0,sy,0,IN_B);g1.addColorStop(0,'rgba(190,255,230,.30)');g1.addColorStop(.12,'rgba(120,255,210,.10)');g1.addColorStop(1,'rgba(0,30,40,.20)');c.fillStyle=g1;c.fillRect(IN_L,sy-8,IN_R-IN_L,IN_B-sy+12);
    c.globalCompositeOperation='screen';
    for(var q=0;q<3;q++){var bx=IN_L+(IN_R-IN_L)*(.5+.32*Math.sin(T*(.31+q*.17)+q*2.1)),by=sy+(IN_B-sy)*(.25+.5*((q*.37+T*.04)%1));
      var rg=c.createRadialGradient(bx,by,0,bx,by,34);rg.addColorStop(0,'rgba(140,255,215,'+(.16+.06*Math.sin(T*1.2+q))+')');rg.addColorStop(1,'rgba(140,255,215,0)');c.fillStyle=rg;c.fillRect(bx-34,by-34,68,68)}
    c.globalCompositeOperation='source-over';
    // bubbles (inside liquid)
    bubbles.forEach(function(b){if(b.y<sy-2)return;var a=cl((IN_B-b.y)/40,0,1)*.95,x=b.x+Math.sin(b.ph+b.life*b.wob*3)*2.2;
      var g=c.createRadialGradient(x-b.r*.3,b.y-b.r*.35,b.r*.1,x,b.y,b.r);g.addColorStop(0,'rgba(255,255,255,'+(.55*a)+')');g.addColorStop(.7,'rgba(210,255,240,'+(.10*a)+')');g.addColorStop(1,'rgba(230,255,248,'+(.55*a)+')');
      c.fillStyle=g;c.beginPath();c.arc(x,b.y,b.r,0,6.283);c.fill();c.strokeStyle='rgba(255,255,255,'+(.5*a)+')';c.lineWidth=.6;c.stroke();
      c.fillStyle='rgba(255,255,255,'+(.9*a)+')';c.beginPath();c.arc(x-b.r*.35,b.y-b.r*.4,Math.max(.4,b.r*.22),0,6.283);c.fill()});
    c.restore();
    // meniscus / surface highlight (clipped to interior by outer clip)
    c.save();c.beginPath();for(x=x0;x<=x1;x+=st){var yy=surfY(x,T,sy);if(x===x0)c.moveTo(x,yy);else c.lineTo(x,yy)}
    var lgc=c.createLinearGradient(IN_L,0,IN_R,0);lgc.addColorStop(0,'rgba(255,255,255,.15)');lgc.addColorStop(.3,'rgba(235,255,248,.95)');lgc.addColorStop(.7,'rgba(235,255,248,.85)');lgc.addColorStop(1,'rgba(255,255,255,.2)');
    c.strokeStyle=lgc;c.lineWidth=1.5;c.shadowColor='rgba(120,255,210,.9)';c.shadowBlur=7;c.stroke();c.restore();
  }
  c.restore();
  // glass shell on top of everything
  mapImg(c,IM.glass,ART.glass);
  // scale ticks (25/50/75/100% of goal) on the right of the tube
  c.save();c.textAlign='left';c.font="700 10px GCB, sans-serif";
  [.25,.5,.75,1].forEach(function(f){var ty=LV_B-(LV_B-LV_T)*f,tx=X(572)+4,on=level>=f-.001;
    c.globalAlpha=on?.95:.62;c.strokeStyle=on?'#6ff0c8':'rgba(225,245,250,.8)';c.lineWidth=1.4;c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=3;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx+(f===1?11:8),ty);c.stroke();
    c.fillStyle=on?'#c9fff0':'rgba(225,245,250,.85)';c.fillText(fmtn(goal*f),tx+15,ty+3.5)});c.restore();
  // celebration glow along the tube
  var gl=Math.max(flash*.9,goalRun>=0?(.55+.35*Math.sin(T*6)):0);
  if(gl>.01){c.save();c.globalCompositeOperation='lighter';c.shadowColor='rgba(90,255,200,'+gl+')';c.shadowBlur=22*gl;c.strokeStyle='rgba(120,255,215,'+(.55*gl)+')';c.lineWidth=2;capsule(c,X(291),Y(118),X(572),Y(895));c.stroke();c.restore()}
  // foot glow ring
  var fa=.25+.22*Math.sin(T*1.6)+flash*.4;
  var rg=c.createRadialGradient(TX,Y(880),2,TX,Y(880),50);rg.addColorStop(0,'rgba(90,255,210,'+fa*.55+')');rg.addColorStop(1,'rgba(90,255,210,0)');
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg;c.save();c.translate(0,Y(880));c.scale(1,.28);c.translate(0,-Y(880));c.fillRect(TX-60,Y(880)-60,120,120);c.restore();c.restore();
}
function renderFx(){
  var c=fxc;c.setTransform(RATIO,0,0,RATIO,0,0);c.clearRect(0,0,W,H);
  rings.forEach(function(r){var p=r.t/1.2;if(p>1)return;c.save();c.globalCompositeOperation='lighter';c.strokeStyle='rgba(120,255,215,'+(1-p)*.8+')';c.lineWidth=3*(1-p)+.5;c.beginPath();c.ellipse(r.x,r.y,30+p*120,9+p*34,0,0,6.283);c.stroke();c.restore()});
  parts.forEach(function(p){var a=cl(p.life-p.t>.5?1:(p.life-p.t)/.5);if(a<=0)return;c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);
    if(p.k==='h'){c.fillStyle=p.c;c.scale(p.sz/5,p.sz/5);c.beginPath();c.moveTo(0,3);c.bezierCurveTo(-6,-3,-6,-8,-3,-9);c.bezierCurveTo(-1,-10,0,-8,0,-7);c.bezierCurveTo(0,-8,1,-10,3,-9);c.bezierCurveTo(6,-8,6,-3,0,3);c.fill()}
    else if(p.k==='s'){c.fillStyle='#fff6c8';c.shadowColor='#ffe27a';c.shadowBlur=6;var s=p.sz;c.beginPath();c.moveTo(0,-s);c.lineTo(s*.25,-s*.25);c.lineTo(s,0);c.lineTo(s*.25,s*.25);c.lineTo(0,s);c.lineTo(-s*.25,s*.25);c.lineTo(-s,0);c.lineTo(-s*.25,-s*.25);c.closePath();c.fill()}
    else{c.fillStyle=p.c;c.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2)}
    c.restore()});
  pops.forEach(function(p){var u=p.t/p.dur;if(u>1)return;var a=u<.15?u/.15:(u>.7?(1-u)/.3:1),y=p.y-eo(u)*46,sc=1+.35*Math.sin(Math.min(1,u*3)*Math.PI)*(1-u);
    c.save();c.globalAlpha=a;c.translate(p.x,y);c.scale(sc,sc);c.textAlign='center';c.font="900 26px GCB, sans-serif";c.lineWidth=5;c.strokeStyle='rgba(0,40,32,.85)';c.lineJoin='round';c.strokeText(p.txt,0,0);
    var g=c.createLinearGradient(0,-22,0,4);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#6ff0c8');c.fillStyle=g;c.shadowColor='rgba(90,255,200,.9)';c.shadowBlur=12;c.fillText(p.txt,0,0);c.restore()});
  if(goalRun>=0&&goalRun<5.2){var u=goalRun,a=u<.4?u/.4:(u>4.4?cl((5.2-u)/.8):1),sc=1+.2*Math.max(0,1-u*2.2);
    c.save();c.globalAlpha=a;c.translate(TX,Y(430));c.scale(sc,sc);c.textAlign='center';c.font="900 21px GCB, sans-serif";var tw=c.measureText('HƏDƏFƏ ÇATDIQ!').width;
    c.fillStyle='rgba(8,24,22,.78)';c.strokeStyle='rgba(255,211,107,.9)';c.lineWidth=1.5;var bw=tw+26,bh=36;c.beginPath();c.moveTo(-bw/2+8,-bh/2);c.arcTo(bw/2,-bh/2,bw/2,bh/2,8);c.arcTo(bw/2,bh/2,-bw/2,bh/2,8);c.arcTo(-bw/2,bh/2,-bw/2,-bh/2,8);c.arcTo(-bw/2,-bh/2,bw/2,-bh/2,8);c.closePath();c.fill();c.stroke();
    var g=c.createLinearGradient(0,-12,0,12);g.addColorStop(0,'#fff7d1');g.addColorStop(1,'#ffc94d');c.fillStyle=g;c.shadowColor='rgba(255,200,80,.85)';c.shadowBlur=12;c.fillText('HƏDƏFƏ ÇATDIQ!',0,7);c.restore()}
}

/* ---------- time step ---------- */
function step(dt){
  dt=Math.min(.1,Math.max(0,dt));T+=dt;
  // number counts up smoothly toward target
  var gap=target-shown;if(Math.abs(gap)>.001)shown+=gap*Math.min(1,dt*3.2)+(gap>0?Math.min(gap,dt*.7):0);if(Math.abs(target-shown)<.02)shown=target;
  // level: spring toward target fraction (goal reached holds 100%)
  var tl=goalRun>=0&&goalRun<4.2?1:cl(target/goal);
  var k=goalRun>=4.2?9:14,dmp=goalRun>=4.2?5:7.5;
  lvVel+=(tl-level)*k*dt*3;lvVel*=Math.exp(-dmp*dt);level+=lvVel*dt;level=cl(level,0,1.02);
  slosh*=Math.exp(-1.9*dt);sloshPh+=dt*(3+slosh*5);flash*=Math.exp(-2.4*dt);
  maybeGoal();
  if(goalRun>=0){goalRun+=dt;
    if(goalRun>=4.2&&goal===celebratedGoal){if(AUTO){settleGoal();fitGoalText();celebratedGoal=-2}}
    if(goalRun>5.6){goalRun=-1;if(!AUTO){/* stays full */}}}
  if(folRun>=0){folRun+=dt;if(folRun>CEL.length/15+.2)folRun=-1}
  if(folShow>=0){folShow+=dt;if(folShow>6)folShow=6.5}
  // bubbles
  var w=IN_R-IN_L;if(level>.03&&rnd()<dt*7){bubbles.push({x:IN_L+8+rnd()*(w-16),y:IN_B-4,r:1.2+rnd()*2.4,v:14+rnd()*26,ph:rnd()*6.28,wob:.6+rnd()*1.2,life:0})}
  var sy=LV_B-(LV_B-LV_T)*cl(level,0,1.0);
  bubbles=bubbles.filter(function(b){b.life+=dt;b.y-=b.v*dt*(b.boost?1.4:1);if(b.y<sy+1){if(rnd()<.6)parts.push({x:b.x,y:sy,vx:(rnd()-.5)*20,vy:-20-rnd()*20,g:120,life:.35,t:0,k:'c',c:'rgba(220,255,245,.9)',sz:1.5,rot:0});return false}return true});
  if(bubbles.length>90)bubbles.splice(0,bubbles.length-90);
  parts=parts.filter(function(p){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;return p.t<p.life});
  pops=pops.filter(function(p){p.t+=dt;return p.t<p.dur});
  rings=rings.filter(function(r){r.t+=dt;return r.t<1.2});
  // panda
  var src;if(goalRun>=0){var fi=Math.floor(goalRun*15);src=fi<CEL.length?CEL[fi]:HAPPY}
  else if(folRun>=0){src=CEL[Math.min(CEL.length-1,Math.floor(folRun*15))]}
  else src=IDLE[Math.floor(T*15)%IDLE.length];
  if(PI.getAttribute('src')!==src)PI.setAttribute('src',src);
  var hop=goalRun>=0?Math.abs(Math.sin(goalRun*5))*10*Math.max(0,1-goalRun/4):(folRun>=0?Math.sin(Math.min(1,folRun/.7)*Math.PI)*7:0);
  PI.style.transform='translateY('+(-hop).toFixed(2)+'px)';
  // texts
  var cur=$('cur');cur.textContent=fmtn(shown);
  var pop=Math.max(folRun>=0&&folRun<.5?1-folRun/.5:0,goalRun>=0&&goalRun<.6?1-goalRun/.6:0);cur.style.transform='scale('+(1+.16*pop*Math.sin(pop*3.14))+')';
  cur.style.color=goalRun>=0?'#fff3c4':'#fff';
  var pc=Math.min(100,Math.round(cl(shown/goal)*100));$('pct').innerHTML=pc+'<small>%</small>';
  var fol=$('fol');if(names.length){var u=folShow<0?1:folShow;var fa=folShow<0?1:cl(u/.35);if(folShow>=0&&u<.45)fol.style.transform='translateY('+((1-eo(u/.45))*12).toFixed(1)+'px) scale('+(.85+.15*eo(u/.45)).toFixed(3)+')';else fol.style.transform='';fol.style.opacity=fa}
  render();renderFx();
}
window.__fg={step:step,setCount:function(n){setCount(n,false)},follow:function(nm,av){pushFollower(nm,av);setCount(target+1)},seed:function(n){setCount(n,true)},ready:window.__fgReady,state:function(){return{target:target,shown:shown,level:level,goal:goal,goalRun:goalRun,folRun:folRun,names:names.length,parts:parts.length,bubbles:bubbles.length}}};
fitGoalText();paintFol();
if(!MANUAL){var last=performance.now();(function loop(now){var dt=Math.min(.1,(now-last)/1000);last=now;step(dt);requestAnimationFrame(loop)})(last)}

/* ---------- live data (SSE /events + /api/state, WS /ws fallback; same channel as other widgets) ---------- */
var lastFollowTs=0,prevN=null;
function onPayload(d){if(!d)return;
  var ev=d.lastAlertEvent;
  if(!names.length&&!lastFollowTs){(d.recentEvents||[]).filter(function(e){return e&&e.type==='follow'}).slice(0,3).reverse().forEach(function(e){pushFollower(e.nickname||e.handle,e.avatarUrl)})}
  if(ev&&ev.type==='follow'&&ev.timestamp){if(!lastFollowTs){lastFollowTs=ev.timestamp;if(!names.length)pushFollower(ev.nickname||ev.uniqueId,ev.avatarUrl)}
    else if(ev.timestamp>lastFollowTs){lastFollowTs=ev.timestamp;pushFollower(ev.nickname||ev.uniqueId,ev.avatarUrl);folShow=0}}
  else if(!lastFollowTs&&ev)lastFollowTs=ev.timestamp||1;
  var fgc=d.config&&d.config.followGoal;if(fgc&&qs.get('cfg')!=='0'&&!MANUAL)applyCfg(fgc);
  if(typeof d.newFollowers==='number')setCount(d.newFollowers,false)}
var cfgKey='';
function applyCfg(c){ // Studio -> live: goal / step / auto-increase (same pattern as the Bəyəni Hədəfi)
  var g=Math.max(1,Math.round(Number(c.goal))||BASE_GOAL),st=Math.max(1,Math.round(Number(c.step))||g),au=!(c.auto===0||c.auto===false||c.auto==='0');
  var k=g+'|'+st+'|'+au;if(k===cfgKey)return;cfgKey=k;BASE_GOAL=g;STEP=st;AUTO=au;
  goal=BASE_GOAL;goalRun=-1;celebratedGoal=-1;if(seeded){settleGoal();if(target>=goal)celebratedGoal=goal}fitGoalText()}
var dbg=$('dbg');if(qs.get('debug')==='1')dbg.style.display='block';
function status(s){dbg.textContent='followgoal: '+s}
function poll(){return fetch(API+'/api/state',{cache:'no-store'}).then(function(r){return r.json()}).then(onPayload).catch(function(){})}
var es=null,ws=null,delay=1000,timer=null,lastMsg=Date.now(),useWS=false,sseFails=0;
function schedule(){if(timer)return;status('reconnect in '+delay+'ms');timer=setTimeout(function(){timer=null;start()},delay);delay=Math.min(delay*2,10000)}
function closeAll(){if(es){try{es.close()}catch(_){}es=null}if(ws){try{ws.onclose=null;ws.close()}catch(_){}ws=null}}
function start(){
  closeAll();poll();
  if(!useWS&&typeof EventSource==='function'){
    try{es=new EventSource(API+'/events')}catch(_){sseFails++;return schedule()}
    es.onopen=function(){delay=1000;sseFails=0;status('SSE live');var opened=Date.now();setTimeout(function(){if(es&&lastMsg<opened){useWS=true;start()}},5000)};
    es.onmessage=function(ev){lastMsg=Date.now();try{onPayload(JSON.parse(ev.data))}catch(_){}};
    es.onerror=function(){status('SSE error');if(es&&es.readyState===2){es=null;if(++sseFails>=3)useWS=true;schedule()}};
  }else{
    try{ws=new WebSocket(API?API.replace(/^http/,'ws')+'/ws':(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(_){useWS=false;return schedule()}
    ws.onopen=function(){delay=1000;status('WS live')};
    ws.onmessage=function(ev){lastMsg=Date.now();try{onPayload(JSON.parse(ev.data))}catch(_){}};
    ws.onclose=function(){ws=null;useWS=false;schedule()};
  }
}
if(DEMO){var v=Math.max(0,goal-7),DN=['aysel_22','Murad','nigar.tv','Elvin Həsənov','şəbnəm_ğ','Kamran'],di=0;setCount(v,true);
  pushFollower('Aysel_K','/assets/avatars/avatar3.jpg');
  setInterval(function(){v++;var i=di++%DN.length;pushFollower(DN[i],'/assets/avatars/avatar'+(i+1)+'.jpg');setCount(v)},3800)}
else if(!MANUAL){
  start();
  setInterval(function(){poll();if(Date.now()-lastMsg>60000){lastMsg=Date.now();delay=1000;start()}},15000);
}
})();
