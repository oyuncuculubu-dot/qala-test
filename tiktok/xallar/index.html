<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>GameCamp — Xallar</title>
  <style>
    html,body{margin:0;padding:0;background:transparent;font-family:Inter,system-ui,sans-serif;color:#fff;}
    body.bg{background:#14141a;min-height:100vh;}
    .box{width:min(400px,96vw);margin:16px auto;background:linear-gradient(180deg,#1c1c22ee,#16161cee);border:1px solid #2e2e34;border-radius:16px;padding:14px 14px 10px;box-shadow:0 12px 40px #0006;}
    h1{margin:0 0 10px;font-size:15px;color:#6ec8ea;letter-spacing:.2px;font-weight:700;}
    .row{display:grid;grid-template-columns:28px 1fr 64px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid #2a2a30;}
    .row:last-child{border-bottom:0;}
    .rk{font-weight:800;color:#8a8a94;font-variant-numeric:tabular-nums;}
    .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee;}
    .bar{height:4px;background:#2a2a32;border-radius:99px;margin-top:4px;overflow:hidden;}
    .bar>i{display:block;height:100%;background:#d53559;}
    .pts{text-align:right;font-variant-numeric:tabular-nums;color:#6ec8ea;font-weight:700;}
    .hint{text-align:center;color:#8a8a94;font-size:11px;margin-top:8px;display:none;}
    body.bg .hint{display:block;}
    .empty{color:#8a8a94;font-size:13px;padding:16px 4px;text-align:center;}
  </style>
<script src="studio-connect.js"></script>
</head>
<body>
  <div class="box">
    <h1>Xal cədvəli</h1>
    <div id="list"><div class="empty">Gözlənilir…</div></div>
    <div class="hint">GameCamp açıq olmalıdır (ws://127.0.0.1:4000/ws)</div>
  </div>
  <script>
  (function(){
    var q=new URLSearchParams(location.search);
    if(q.get('bg')==='1') document.body.classList.add('bg');
    var host=q.get('host')||'127.0.0.1:4000';
    var count=Math.max(1, Math.min(30, Number(q.get('count')||10)));
    var rates={like:1,diamond:10,follow:50,join:5};
    function render(state){
      if(state&&state.config&&state.config.gamecamp&&state.config.gamecamp.points){
        rates=Object.assign(rates,state.config.gamecamp.points);
      }
      var map={};
      function acc(p){
        var id=p.uniqueId||p.nickname; if(!id) return;
        if(!map[id]) map[id]={name:p.nickname||id,likes:0,diamonds:0};
        if(p.nickname) map[id].name=p.nickname;
        map[id].likes+=Number(p.likes||p.likeCount||0)||0;
        map[id].diamonds+=Number(p.diamonds||p.diamondCount||0)||0;
      }
      (state.leaders||[]).forEach(acc);
      (state.gifterLeaders||[]).forEach(acc);
      var rows=Object.keys(map).map(function(id){
        var r=map[id]; r.points=r.likes*(Number(rates.like)||0)+r.diamonds*(Number(rates.diamond)||0); return r;
      }).sort(function(a,b){return b.points-a.points;}).slice(0,count);
      var box=document.getElementById('list');
      if(!rows.length){ box.innerHTML='<div class="empty">Hələ xal yoxdur</div>'; return; }
      var max=Math.max(1,rows[0].points);
      box.innerHTML=rows.map(function(r,i){
        var pct=Math.round((r.points/max)*100);
        return '<div class="row"><div class="rk">'+(i+1)+'</div><div><div class="nm">'+String(r.name).replace(/[<>]/g,'')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="pts">'+Math.round(r.points).toLocaleString('en-US')+'</div></div>';
      }).join('');
    }
    var proto=location.protocol==='https:'?'wss:':'ws:';
    var url=(host.indexOf('://')>=0?host:(proto+'//'+host));
    if(url.indexOf('/ws')<0) url=url.replace(/\/$/,'')+'/ws';
    function connect(){
      try{
        var ws=new WebSocket(url);
        ws.onmessage=function(e){ try{render(JSON.parse(e.data));}catch(_){ } };
        ws.onclose=function(){ setTimeout(connect,2000); };
      }catch(_){ setTimeout(connect,2000); }
    }
    connect();
  })();
  </script>
</body>
</html>
