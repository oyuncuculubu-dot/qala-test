/* CatJar 7 — photoreal cat (video sprites, VP9 alpha WebM) + TikTok LIVE gift jar for TikFinity / OBS
   • Gifts: TikFinity AZ Studio SSE /events (http://localhost:4000)  (+ CatJar5 SSE /events & /api/state when served over http)
   • Gift art: full current AZ catalog (webcast/gift/list aid=1988 priority_region=AZ, Euler-cross-checked) bundled as ../gifts/icons/{id}.webp; fallback: event giftPictureUrl, then a gift box — never a blank
   • Gift alert: large upper-center avatar in a gold animated frame, gift image + "{ad} {hədiyyə} atdı" (queued; streaks bump ×N; then the gift flies to the cat)
   • Test:  ?test=1  → auto gifts.  Keys: G gift · B big gift · C Orxan Tac · S streak · F almost full · R reset · T auto-test · H help
   • Reset saved jar: ?reset=1  or key R.   Other params: ?id=name ?capacity=0.7 ?min=1 ?fulltext=... ?align=left|right ?port=21213
*/
(()=>{'use strict';

const Q=new URLSearchParams(location.search);
const qb=k=>Q.has(k)&&!['0','false','no'].includes(Q.get(k));
const CFG={port:Q.get('port')||'21213',test:qb('test')||qb('demo'),bg:Q.get('bg')||'',fullText:Q.get('fulltext')||'BANKA DOLDU!',
  capacity:Math.max(0.05,parseFloat(Q.get('capacity')||'1')),minCoins:Math.max(1,parseInt(Q.get('min')||'1',10)),
  step:qb('step'),seed:parseInt(Q.get('seed')||'0',10)||0,nosave:qb('nosave'),align:Q.get('align')||'center',
  key:'catjar7_'+(Q.get('id')||'default'),names:!Q.has('names')||qb('names')};
if(qb('reset')){try{localStorage.removeItem(CFG.key)}catch(e){}}

/* ---------- utils ---------- */
let seedS=CFG.seed||1;
const rnd=CFG.seed?()=>{seedS=seedS+0x6D2B79F5|0;let t=Math.imul(seedS^seedS>>>15,1|seedS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}:Math.random;
const R=(a,b)=>a+(b-a)*rnd(),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
const bez=(p,c,q,k)=>({x:(1-k)*(1-k)*p.x+2*(1-k)*k*c.x+k*k*q.x,y:(1-k)*(1-k)*p.y+2*(1-k)*k*c.y+k*k*q.y});
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,eo=k=>1-Math.pow(1-k,3);
const eob=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
/* ---------- gifts: full current TikTok AZ catalog (official CDN icons, bundled) ---------- */
const GIFT_ICON_DIR='../gifts/icons/';
const GIFT_BOX='../gifts/box.png';
function giftLocalFile(g){
  if(!g)return '';
  if(g.file)return g.file;
  if(g.id!=null&&g.id!=='')return GIFT_ICON_DIR+g.id+'.webp';
  return '';
}
const GIFT_CATALOG=(window.TT_AZ_GIFTS||[]).map(g=>({
  name:g.name,az:g.az||'',id:g.id,dia:g.dia,cdn:g.cdn||'',file:giftLocalFile(g)
}));
for(const g of (window.TT_AZ_GIFT_EXTRAS||[])){
  GIFT_CATALOG.push({name:g.name,az:g.az||'',id:g.id,dia:g.dia,cdn:g.cdn||'',file:g.file||giftLocalFile(g),extra:true});
}
const GIFT_BY_NAME=new Map(),GIFT_BY_ID=new Map(),GIFT_NAME_ALL=new Map();
const GIFT_ALIAS={'hand hearts':'hand heart','hearts':'hand heart','tac':'tsar','çar':'tsar',
  'universe':'tiktok universe','kainat':'tiktok universe','ice cream':'ice cream cone','dondurma':'ice cream cone',
  'donut':'doughnut','gül':'rose','qızılgül':'rose','şir':'lion','qalaktika':'galaxy','little crown':'little crown','kiçik tac':'little crown',
  'dələ':'squirrel','dele':'squirrel','dəle':'squirrel','dela':'squirrel','dalə':'squirrel',
  'pişik':'cat','pisik':'cat','pisi':'cat','pisiq':'cat','pişi':'cat','kedisi':'cat','kedi':'cat'};
function normGift(n){return (n||'').trim().toLowerCase().replace(/\s+/g,' ')}
function addNameKey(k,g){
  if(!k)return;
  if(!GIFT_NAME_ALL.has(k))GIFT_NAME_ALL.set(k,[]);
  const arr=GIFT_NAME_ALL.get(k);
  if(!arr.includes(g))arr.push(g);
  arr.sort((a,b)=>(a.dia||0)-(b.dia||0));
  if(!GIFT_BY_NAME.has(k) || ((GIFT_BY_NAME.get(k).dia||0)>(g.dia||0))) GIFT_BY_NAME.set(k,arr[0]);
}
for(const g of GIFT_CATALOG){
  if(g.id!=null&&g.id!=='')GIFT_BY_ID.set(String(g.id),g);
  addNameKey(normGift(g.name),g);
  addNameKey(normGift(g.az),g);
}
function findGift(name,id,dia){
  if(id!=null&&id!==''&&GIFT_BY_ID.has(String(id)))return GIFT_BY_ID.get(String(id));
  const k=normGift(name);
  const pick=cands=>{
    if(!cands||!cands.length)return null;
    if(dia!=null&&dia!==''){
      const n=Number(dia);
      const m=cands.find(g=>Number(g.dia)===n);
      if(m)return m;
    }
    return cands[0];
  };
  let hit=pick(GIFT_NAME_ALL.get(k));
  if(hit)return hit;
  if(GIFT_ALIAS[k]){
    hit=pick(GIFT_NAME_ALL.get(normGift(GIFT_ALIAS[k])));
    if(hit)return hit;
    if(GIFT_BY_NAME.has(GIFT_ALIAS[k]))return GIFT_BY_NAME.get(GIFT_ALIAS[k]);
  }
  return null;
}
function asEvent(g){return {giftName:g.az||g.name,giftId:g.id,diamondCount:g.dia,giftPictureUrl:g.file}}
const DEMO_IDS=[5655,5269,7934,5487,6064,5827,5879,5658,5660,5585,6267,7168,11046,5524,6097,6890,12920,1213439,12725];
const GIFT_DEMO=DEMO_IDS.map(id=>GIFT_BY_ID.get(String(id))).filter(Boolean);
for(const g of GIFT_CATALOG){if(g.extra&&!GIFT_DEMO.includes(g))GIFT_DEMO.push(g)}
const TEST_GIFTS=GIFT_DEMO.filter(g=>g.dia<=199).map(asEvent);
const CROWN_GIFT=asEvent(GIFT_BY_ID.get('5524')||GIFT_BY_NAME.get('tsar')||GIFT_DEMO[0]);
const BIG_GIFTS=GIFT_DEMO.filter(g=>g.dia>=199).map(asEvent);
let giftIdCache={};
try{if(!CFG.nosave)giftIdCache=JSON.parse(localStorage.getItem(CFG.key+'_giftimg')||'{}')||{}}catch(_){}
function rememberGift(id,url){if(id==null||id===''||!url)return;giftIdCache[String(id)]=url;if(CFG.nosave)return;try{localStorage.setItem(CFG.key+'_giftimg',JSON.stringify(giftIdCache))}catch(_){}}
function artCandidates(name,id,url,dia){
  const out=[],seen=new Set();
  const add=u=>{if(u&&!seen.has(u)){seen.add(u);out.push(u)}};
  const loc=findGift(name,id,dia);
  const remote=url&&/^https?:/i.test(url)?url:'';
  if(remote)rememberGift(id,remote);
  if(loc){add(loc.file);add(loc.cdn)}
  if(id!=null&&id!==''&&giftIdCache[String(id)])add(giftIdCache[String(id)]);
  add(remote);
  add(GIFT_BOX);
  return out;
}
function resolveArt(name,id,url,dia){
  const c=artCandidates(name,id,url,dia);
  for(const u of c) getImg(u);
  return c[0]||GIFT_BOX;
}
const NICKS=['Aysel','Murad_77','nigar.k','Orxan','Leyla','Elvin','Gunay','Tural','Sevda','Kamran'];
const AVATARS={Aysel:'assets/demo/aysel.jpg',Murad_77:'assets/demo/murad.jpg',Leyla:'assets/demo/leyla.jpg',Orxan:'assets/demo/orxan.jpg','nigar.k':'assets/demo/nigar.jpg',Gunay:'assets/demo/gunay.jpg',Tural:'assets/demo/tural.jpg',Elvin:'assets/demo/elvin.jpg'};
function giftAz(n,id,dia){
  const g=findGift(n,id,dia);
  if(g&&g.az)return g.az;
  const s=(n||'').trim(),k=normGift(s);
  if(GIFT_ALIAS[k]){
    const alt=findGift(GIFT_ALIAS[k],id,dia);
    if(alt&&alt.az)return alt.az;
  }
  if(/dələ|dele|squirrel/.test(k))return'Dələ';
  if(/pişik|pisik|\bcat\b/.test(k))return'Pişik';
  if(g&&g.name)return g.name;
  return s||'Hədiyyə';
}

function giftTier(d){d=+d||0;return d>=5000?3:d>=100?2:d>=20?1:0}
const imgCache=new Map();
function getImg(url){if(!url)return null;let o=imgCache.get(url);
  if(!o){
    o={img:new Image(),ok:false,bad:false};
    const remote=/^https?:/i.test(url)&&!/^(https?:\/\/)?(localhost|127\.0\.0\.1)\b/i.test(url)&&url.indexOf(location.origin)!==0;
    if(remote)o.img.crossOrigin='anonymous';
    o.img.onload=()=>{o.ok=true};
    o.img.onerror=()=>{o.bad=true};
    o.img.src=url;imgCache.set(url,o)
  }return o}
function mk(sz,f){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.translate(sz/2,sz/2);f(g,sz/2);return c}

 heart:mk(200,(g,r)=>{const s=r*.9,p=heartPath(s);let gr=g.createRadialGradient(-s*.3,-s*.4,4,0,0,s*1.1);gr.addColorStop(0,'#ff8fb1');gr.addColorStop(.5,'#ff2d6f');gr.addColorStop(1,'#a3003a');g.fillStyle=gr;g.fill(p);g.save();g.clip(p);g.fillStyle=gloss(g,s);g.fill(p);g.restore()}),

 gift:mk(200,(g,r)=>{const s=r*.82;let gr=g.createLinearGradient(-s,0,s,0);gr.addColorStop(0,'#7b2cff');gr.addColorStop(1,'#d14bff');g.fillStyle=gr;g.beginPath();g.roundRect(-s*.8,-s*.25,s*1.6,s*1.05,s*.12);g.fill();g.fillStyle='#9a44ff';g.beginPath();g.roundRect(-s*.92,-s*.52,s*1.84,s*.36,s*.1);g.fill();g.fillStyle='#ffd25a';g.fillRect(-s*.13,-s*.52,s*.26,s*1.32);g.beginPath();g.ellipse(-s*.3,-s*.62,s*.32,s*.17,-.5,0,7);g.ellipse(s*.3,-s*.62,s*.32,s*.17,.5,0,7);g.fill()}),
 gem:mk(200,(g,r)=>{const s=r*.9;const f=(a,c)=>{g.fillStyle=c;g.beginPath();a.forEach(p=>g.lineTo(p[0]*s,p[1]*s));g.fill()};f([[-.95,-.25],[-.5,-.75],[.5,-.75],[.95,-.25],[0,.9]],'#2bb8ff');f([[-.95,-.25],[.95,-.25],[0,.9]],'#0a7fe0');f([[-.5,-.75],[0,-.25],[-.95,-.25]],'#8fe3ff');f([[-.5,-.75],[.5,-.75],[0,-.25]],'#c9f3ff');f([[.5,-.75],[.95,-.25],[0,-.25]],'#55c8ff')}),
 star:mk(200,(g,r)=>{const s=r*.92;let gr=g.createRadialGradient(-s*.2,-s*.3,4,0,0,s);gr.addColorStop(0,'#fff8c8');gr.addColorStop(.5,'#ffcc33');gr.addColorStop(1,'#d07a00');g.fillStyle=gr;g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?s*.45:s;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill()}),

function iconFor(name,d){const n=(name||'').toLowerCase();if(/heart|love/.test(n))return'heart';if(/diamond|gem/.test(n))return'gem';if(/star/.test(n))return'star';if(/coin|tiktok/.test(n))return'coin';return d>=1000?'gem':d>=100?'gift':d>=10?'star':'heart'}

  else if(k==='s'){const g=Object.assign({},TEST_GIFTS[0],{nickname:'Aysel',uniqueId:'Aysel',profilePictureUrl:AVATARS.Aysel,giftType:1});for(let i=1;i<=5;i++)setTimeout(()=>onGiftEvent(Object.assign({},g,{repeatCount:i,repeatEnd:i===5})),i*120)}
  else if(k==='f')fillTo(0.9);else if(k==='r'){items=[];coins=0;jars=0;queue.length=0;alertQ.length=0;AL=null;save()}
  else if(k==='t')test.on=!test.on;else if(k==='h')hint.style.display=hint.style.display==='block'?'none':'block'});
if(CFG.test){hint.style.display='block';setTimeout(()=>hint.style.display='none',7000)}

window.CatJar={_dbg:()=>({items:items.map(i=>[Math.round(i.x),Math.round(i.y),i.r]),wall:wallPts.map(p=>[Math.round(p.x),Math.round(p.y)]),JAR,JX,neckL,neckR}),gift:onGiftEvent,test:testGift,fillTo,reset:()=>{items=[];coins=0;jars=0;queue.length=0;alertQ.length=0;AL=null;save()},
  crown:()=>testGift(true,'crown'),state:()=>({items:items.length,fill:fillFrac(),coins,jars,mode,queue:queue.length,busy:!!D,ws:wsOK,clip:P.cur&&P.cur.name,t:P.t,alert:AL&&{nick:AL.nick,name:AL.name,units:AL.units,dia:AL.dia,age:+AL.age.toFixed(2),hold:+AL.hold.toFixed(2),life:+AL.life.toFixed(2)},vids:Object.values(CLIP).map(c=>c.ok?1:c.bad?-1:0).join('')}),
  advance:async(n,dt)=>{for(let i=0;i<n;i++)update(dt||1/30);await syncVideos();render()},
  ready:()=>imgOK>=2&&Object.values(CLIP).every(c=>c.ok&&c.v.readyState>=2)&&[...imgCache.values()].every(o=>o.ok||o.bad),
  preload:()=>{GIFT_DEMO.forEach(g=>{getImg(g.file);if(g.cdn)getImg(g.cdn)});getImg(GIFT_BOX);Object.values(AVATARS).forEach(u=>getImg(u))}};
load();for(let k=0;k<240;k++)step(SUB);
if(CFG.step){startClip('idle');render()}else requestAnimationFrame(loop);
})();
